<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iLink × 大模型 Trace</title>
    <style>
      :root {
        --bg: #070910;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-2: rgba(255, 255, 255, 0.08);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.64);
        --faint: rgba(255, 255, 255, 0.45);
        --ok: #51ffb3;
        --warn: #ffcc66;
        --err: #ff4d6d;
        --accent: #7aa7ff;
        --shadow: 0 18px 70px rgba(0, 0, 0, 0.5);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: var(--sans);
        background: radial-gradient(1200px 800px at 20% 10%, rgba(122, 167, 255, 0.18), transparent 55%),
          radial-gradient(900px 650px at 80% 15%, rgba(81, 255, 179, 0.12), transparent 60%),
          radial-gradient(900px 700px at 70% 85%, rgba(255, 77, 109, 0.12), transparent 55%),
          linear-gradient(180deg, #070910 0%, #05070d 100%);
      }

      .wrap {
        max-width: 1320px;
        margin: 0 auto;
        padding: 22px 18px 28px;
      }

      .top {
        display: flex;
        gap: 14px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .title h1 {
        margin: 0;
        letter-spacing: 0.2px;
        font-size: 22px;
        line-height: 1.15;
      }

      .title p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.04);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        box-shadow: 0 0 0 3px rgba(122, 167, 255, 0.12);
        background: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--stroke);
        background: var(--panel);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel .head {
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--stroke);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel .head strong {
        font-size: 13px;
        letter-spacing: 0.2px;
      }

      .panel .body {
        padding: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr auto;
        gap: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .field input,
      .field select {
        border-radius: 12px;
        border: 1px solid var(--stroke);
        background: rgba(0, 0, 0, 0.25);
        padding: 10px 11px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(122, 167, 255, 0.55);
        box-shadow: 0 0 0 4px rgba(122, 167, 255, 0.14);
      }

      .btns {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        justify-content: flex-end;
      }

      button {
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 12px;
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .ghost {
        background: transparent;
      }

      .tableWrap {
        overflow: auto;
        max-height: calc(100vh - 270px);
        border-radius: 12px;
        border: 1px solid var(--stroke);
        background: rgba(0, 0, 0, 0.22);
      }

      .detailWrap {
        overflow: auto;
        max-height: calc(100vh - 220px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 12px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        text-align: left;
        padding: 10px 10px;
        color: var(--muted);
        border-bottom: 1px solid var(--stroke);
        background: rgba(8, 10, 18, 0.85);
        backdrop-filter: blur(12px);
      }

      tbody td {
        padding: 10px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.82);
        vertical-align: top;
      }

      tbody tr {
        cursor: pointer;
        transition: background 120ms ease;
      }

      tbody tr:hover {
        background: rgba(122, 167, 255, 0.08);
      }

      tbody tr.selected {
        background: rgba(81, 255, 179, 0.08);
        outline: 1px solid rgba(81, 255, 179, 0.28);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        white-space: nowrap;
      }

      .status i {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        display: inline-block;
      }

      .status.ok i {
        background: var(--ok);
        box-shadow: 0 0 0 4px rgba(81, 255, 179, 0.12);
      }

      .status.err i {
        background: var(--err);
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.12);
      }

      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px 12px;
        margin-bottom: 12px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .kv div:nth-child(odd) {
        color: var(--muted);
      }

      .monoBox {
        border: 1px solid var(--stroke);
        background: rgba(0, 0, 0, 0.25);
        border-radius: 14px;
        overflow: hidden;
        margin-top: 10px;
      }

      .monoHead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
      }

      pre {
        margin: 0;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.85);
      }

      details {
        margin-top: 10px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.15);
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        padding: 10px 12px;
        user-select: none;
        transition: background 120ms ease;
      }

      summary:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      details[open] summary {
        border-bottom: 1px solid var(--stroke);
      }

      .section {
        margin-bottom: 16px;
      }

      .section-title {
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .hint {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .tableWrap {
          max-height: 48vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="title">
          <h1>iLink × 大模型 Trace</h1>
          <p>用于查看 iLink 与微信消息结构（ilinkMessageJson）以及调用大模型的请求体（llmRequestJson/imageLlmRequestJson）、耗时与错误。</p>
        </div>
        <div class="badge">
          <span class="dot" id="liveDot"></span>
          <span id="liveText">自动刷新：开启</span>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="head">
            <strong>追踪列表</strong>
            <span class="hint" id="listMeta">0 条</span>
          </div>
          <div class="body">
            <div class="controls">
              <div class="field">
                <label for="sessionFilter">sessionId / userId</label>
                <input id="sessionFilter" placeholder="例如：wxid_xxx" autocomplete="off" />
              </div>
              <div class="field">
                <label for="kwFilter">关键字</label>
                <input id="kwFilter" placeholder="匹配 user/request/reply/error" autocomplete="off" />
              </div>
              <div class="field">
                <label for="interval">刷新间隔</label>
                <select id="interval">
                  <option value="1000">1s</option>
                  <option value="2000" selected>2s</option>
                  <option value="5000">5s</option>
                  <option value="10000">10s</option>
                </select>
              </div>
              <div class="btns">
                <button id="toggleLive">暂停</button>
                <button id="refreshNow" class="ghost">刷新</button>
              </div>
            </div>

            <div style="height: 12px"></div>

            <div class="tableWrap">
              <table>
                <thead>
                  <tr>
                    <th style="min-width: 170px">时间</th>
                    <th style="min-width: 160px">sessionId</th>
                    <th style="min-width: 160px">model</th>
                    <th style="min-width: 90px">耗时</th>
                    <th style="min-width: 110px">状态</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="head">
            <strong>追踪详情</strong>
            <span class="hint" id="detailMeta">未选择</span>
          </div>
          <div class="body">
            <div class="detailWrap" id="detailBody">
              <div class="hint">点击左侧列表中的任意一条记录查看详情。</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const state = {
        live: true,
        intervalMs: 2000,
        traces: [],
        selectedKey: null,
        lastRenderedKey: null  // 缓存上次渲染的 key
      };

      const el = {
        liveText: document.getElementById("liveText"),
        liveDot: document.getElementById("liveDot"),
        tbody: document.getElementById("tbody"),
        listMeta: document.getElementById("listMeta"),
        detailMeta: document.getElementById("detailMeta"),
        detailBody: document.getElementById("detailBody"),
        sessionFilter: document.getElementById("sessionFilter"),
        kwFilter: document.getElementById("kwFilter"),
        interval: document.getElementById("interval"),
        toggleLive: document.getElementById("toggleLive"),
        refreshNow: document.getElementById("refreshNow")
      };

      function toText(v) {
        if (v === null || v === undefined) return "";
        return String(v);
      }

      function traceKey(t) {
        return [toText(t.timestamp), toText(t.sessionId), toText(t.responseTimeMs)].join("|");
      }

      function fmtTime(ts) {
        if (!ts) return "-";
        try {
          const d = new Date(ts);
          return d.toLocaleString();
        } catch {
          return toText(ts);
        }
      }

      function isErr(t) {
        return !!(t && t.errorMsg && toText(t.errorMsg).trim().length > 0);
      }

      function matchFilter(t) {
        const session = el.sessionFilter.value.trim();
        if (session) {
          if (!toText(t.sessionId).includes(session)) return false;
        }
        const kw = el.kwFilter.value.trim();
        if (kw) {
          const hay = [
            toText(t.userText),
            toText(t.requestText),
            toText(t.replyText),
            toText(t.errorMsg),
            toText(t.contextToken),
            toText(t.model)
          ].join("\n");
          if (!hay.includes(kw)) return false;
        }
        return true;
      }

      function setLive(v) {
        state.live = v;
        el.liveText.textContent = "自动刷新：" + (v ? "开启" : "暂停");
        el.toggleLive.textContent = v ? "暂停" : "继续";
        el.liveDot.style.background = v ? "var(--accent)" : "var(--warn)";
        el.liveDot.style.boxShadow = v ? "0 0 0 3px rgba(122, 167, 255, 0.12)" : "0 0 0 3px rgba(255, 204, 102, 0.12)";
      }

      function render() {
        const filtered = state.traces.filter(matchFilter);
        el.listMeta.textContent = `${filtered.length} 条`;

        el.tbody.innerHTML = filtered
          .map((t) => {
            const key = traceKey(t);
            const selected = key === state.selectedKey ? "selected" : "";
            const statusClass = isErr(t) ? "status err" : "status ok";
            const statusText = isErr(t) ? "失败" : "成功";
            const ms = t.responseTimeMs === null || t.responseTimeMs === undefined ? "-" : `${t.responseTimeMs}ms`;
            return `
              <tr class="${selected}" data-key="${key}">
                <td>${fmtTime(t.timestamp)}</td>
                <td>${toText(t.sessionId) || "-"}</td>
                <td>${toText(t.model) || "-"}</td>
                <td>${ms}</td>
                <td><span class="${statusClass}"><i></i>${statusText}</span></td>
              </tr>
            `;
          })
          .join("");

        el.tbody.querySelectorAll("tr").forEach((tr) => {
          tr.addEventListener("click", () => {
            state.selectedKey = tr.getAttribute("data-key");
            render();
          });
        });

        const selected = state.traces.find((t) => traceKey(t) === state.selectedKey) || null;
        renderDetail(selected);
      }

      function copyText(text) {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(text || "");
      }

      function renderDetail(t) {
        if (!t) {
          el.detailMeta.textContent = "未选择";
          el.detailBody.innerHTML = `<div class="hint">点击左侧列表中的任意一条记录查看详情。</div>`;
          state.lastRenderedKey = null;
          return;
        }

        // 如果是同一条记录，跳过重新渲染
        const currentKey = traceKey(t);
        if (currentKey === state.lastRenderedKey) {
          return;
        }
        state.lastRenderedKey = currentKey;

        const status = isErr(t) ? "失败" : "成功";
        el.detailMeta.textContent = `${status} · ${toText(t.responseTimeMs) || "-"}ms`;

        const raw = JSON.stringify(t, null, 2);
        const requestText = toText(t.requestText);
        const replyText = toText(t.replyText);
        const errorText = toText(t.errorMsg);
        const ilinkJson = toText(t.ilinkMessageJson);
        const llmRequestJson = toText(t.llmRequestJson);
        const imageLlmRequestJson = toText(t.imageLlmRequestJson);
        const generatedImageRequestJson = toText(t.generatedImageRequestJson);
        const generatedImageResponseJson = toText(t.generatedImageResponseJson);
        const ttsRequestJson = toText(t.ttsRequestJson);
        const ttsResponseJson = toText(t.ttsResponseJson);

        // 判断各个字段是否为空
        const hasIlink = ilinkJson && ilinkJson !== "-";
        const hasImageLlm = imageLlmRequestJson && imageLlmRequestJson !== "-";
        const hasImageDesc = toText(t.imageDescription) && toText(t.imageDescription) !== "-";
        const hasGenImageReq = generatedImageRequestJson && generatedImageRequestJson !== "-";
        const hasGenImageResp = generatedImageResponseJson && generatedImageResponseJson !== "-";
        const hasTtsReq = ttsRequestJson && ttsRequestJson !== "-";
        const hasTtsResp = ttsResponseJson && ttsResponseJson !== "-";
        const hasUserText = toText(t.userText) && toText(t.userText) !== "-";
        const hasLlmReq = llmRequestJson && llmRequestJson !== "-";
        const hasRequest = requestText && requestText !== "-";
        const hasReply = replyText && replyText !== "-";
        const hasError = errorText && errorText !== "-";

        el.detailBody.innerHTML = `
          <div class="section">
            <div class="section-title">基本信息</div>
            <div class="kv">
              <div>timestamp</div><div>${fmtTime(t.timestamp)}</div>
              <div>sessionId</div><div>${toText(t.sessionId) || "-"}</div>
              <div>contextToken</div><div>${toText(t.contextToken) || "-"}</div>
              <div>model</div><div>${toText(t.model) || "-"}</div>
              <div>messageItemType</div><div>${toText(t.messageItemType) || "-"}</div>
            </div>
          </div>

          ${hasIlink ? `
          <div class="section">
            <div class="section-title">iLink 消息结构</div>
            <div class="monoBox">
              <div class="monoHead">
                <span>ilinkMessageJson</span>
                <button class="ghost" data-copy="ilink">复制</button>
              </div>
              <pre>${ilinkJson}</pre>
            </div>
          </div>
          ` : ''}

          ${(hasImageLlm || hasImageDesc || toText(t.imageUrl) !== "-" || toText(t.imageModel) !== "-") ? `
          <details>
            <summary>🖼️ 图片理解相关 ${hasImageLlm || hasImageDesc ? '' : '(无数据)'}</summary>
            <div style="padding: 12px;">
              <div class="kv" style="margin-bottom: 12px;">
                <div>imageUrl</div><div>${toText(t.imageUrl) || "-"}</div>
                <div>imageModel</div><div>${toText(t.imageModel) || "-"}</div>
              </div>
              ${hasImageLlm ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>imageLlmRequestJson</span>
                  <button class="ghost" data-copy="imageLlmRequestJson">复制</button>
                </div>
                <pre>${imageLlmRequestJson}</pre>
              </div>
              ` : ''}
              ${hasImageDesc ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>imageDescription</span>
                  <button class="ghost" data-copy="imageDescription">复制</button>
                </div>
                <pre>${toText(t.imageDescription)}</pre>
              </div>
              ` : ''}
            </div>
          </details>
          ` : ''}

          ${(hasGenImageReq || hasGenImageResp || toText(t.generatedImageUrl) !== "-") ? `
          <details>
            <summary>🎨 图片生成相关 ${hasGenImageReq || hasGenImageResp ? '' : '(无数据)'}</summary>
            <div style="padding: 12px;">
              <div class="kv" style="margin-bottom: 12px;">
                <div>generatedImageUrl</div><div>${toText(t.generatedImageUrl) || "-"}</div>
              </div>
              ${hasGenImageReq ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>generatedImageRequestJson</span>
                  <button class="ghost" data-copy="generatedImageRequestJson">复制</button>
                </div>
                <pre>${generatedImageRequestJson}</pre>
              </div>
              ` : ''}
              ${hasGenImageResp ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>generatedImageResponseJson</span>
                  <button class="ghost" data-copy="generatedImageResponseJson">复制</button>
                </div>
                <pre>${generatedImageResponseJson}</pre>
              </div>
              ` : ''}
            </div>
          </details>
          ` : ''}

          ${(hasTtsReq || hasTtsResp || toText(t.ttsPlayTimeMs) !== "-" || toText(t.ttsSampleRate) !== "-") ? `
          <details>
            <summary>🔊 TTS 相关 ${hasTtsReq || hasTtsResp ? '' : '(无数据)'}</summary>
            <div style="padding: 12px;">
              <div class="kv" style="margin-bottom: 12px;">
                <div>ttsPlayTimeMs</div><div>${toText(t.ttsPlayTimeMs) || "-"}</div>
                <div>ttsSampleRate</div><div>${toText(t.ttsSampleRate) || "-"}</div>
              </div>
              ${hasTtsReq ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>ttsRequestJson</span>
                  <button class="ghost" data-copy="ttsRequestJson">复制</button>
                </div>
                <pre>${ttsRequestJson}</pre>
              </div>
              ` : ''}
              ${hasTtsResp ? `
              <div class="monoBox">
                <div class="monoHead">
                  <span>ttsResponseJson</span>
                  <button class="ghost" data-copy="ttsResponseJson">复制</button>
                </div>
                <pre>${ttsResponseJson}</pre>
              </div>
              ` : ''}
            </div>
          </details>
          ` : ''}

          ${hasUserText || hasLlmReq || hasRequest || hasReply ? `
          <div class="section">
            <div class="section-title">对话内容</div>
            ${hasUserText ? `
            <div class="monoBox">
              <div class="monoHead">
                <span>userText</span>
                <button class="ghost" data-copy="user">复制</button>
              </div>
              <pre>${toText(t.userText)}</pre>
            </div>
            ` : ''}
            ${hasLlmReq ? `
            <details style="margin-top: 10px;">
              <summary>📤 llmRequestJson</summary>
              <div style="padding: 12px;">
                <div class="monoBox">
                  <div class="monoHead">
                    <span>llmRequestJson</span>
                    <button class="ghost" data-copy="llmRequestJson">复制</button>
                  </div>
                  <pre>${llmRequestJson}</pre>
                </div>
              </div>
            </details>
            ` : ''}
            ${hasRequest ? `
            <details style="margin-top: 10px;">
              <summary>📝 requestText (完整上下文)</summary>
              <div style="padding: 12px;">
                <div class="monoBox">
                  <div class="monoHead">
                    <span>requestText</span>
                    <button class="ghost" data-copy="request">复制</button>
                  </div>
                  <pre>${requestText}</pre>
                </div>
              </div>
            </details>
            ` : ''}
            ${hasReply ? `
            <div class="monoBox" style="margin-top: 10px;">
              <div class="monoHead">
                <span>replyText</span>
                <button class="ghost" data-copy="reply">复制</button>
              </div>
              <pre>${replyText}</pre>
            </div>
            ` : ''}
          </div>
          ` : ''}

          ${hasError ? `
          <div class="section">
            <div class="section-title">错误信息</div>
            <div class="monoBox">
              <div class="monoHead">
                <span>errorMsg</span>
                <button class="ghost" data-copy="error">复制</button>
              </div>
              <pre style="color: var(--err)">${errorText}</pre>
            </div>
          </div>
          ` : ''}

          <details style="margin-top: 16px;">
            <summary>📋 原始 JSON</summary>
            <div style="padding: 12px;">
              <div class="monoBox">
                <div class="monoHead">
                  <span>raw</span>
                  <button class="ghost" data-copy="raw">复制</button>
                </div>
                <pre>${raw}</pre>
              </div>
            </div>
          </details>
        `;

        el.detailBody.querySelectorAll("button[data-copy]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const kind = btn.getAttribute("data-copy");
            if (kind === "user") copyText(toText(t.userText));
            if (kind === "request") copyText(requestText);
            if (kind === "reply") copyText(replyText);
            if (kind === "error") copyText(errorText);
            if (kind === "ilink") copyText(ilinkJson);
            if (kind === "imageDescription") copyText(toText(t.imageDescription));
            if (kind === "llmRequestJson") copyText(llmRequestJson);
            if (kind === "imageLlmRequestJson") copyText(imageLlmRequestJson);
            if (kind === "generatedImageRequestJson") copyText(generatedImageRequestJson);
            if (kind === "generatedImageResponseJson") copyText(generatedImageResponseJson);
            if (kind === "ttsRequestJson") copyText(ttsRequestJson);
            if (kind === "ttsResponseJson") copyText(ttsResponseJson);
            if (kind === "raw") copyText(raw);
          });
        });
      }

      const apiBase = location.origin === "null" ? "http://localhost:8080" : "";

      async function fetchTraces() {
        const resp = await fetch(`${apiBase}/api/ai/traces`, { headers: { Accept: "application/json" } });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (!Array.isArray(data)) return;
        state.traces = data;
        if (!state.selectedKey && state.traces.length > 0) {
          state.selectedKey = traceKey(state.traces[0]);
        }
        render();
      }

      function schedule() {
        setTimeout(async () => {
          if (state.live) {
            try {
              await fetchTraces();
            } catch {
              render();
            }
          }
          schedule();
        }, state.intervalMs);
      }

      el.toggleLive.addEventListener("click", () => setLive(!state.live));
      el.refreshNow.addEventListener("click", fetchTraces);
      el.interval.addEventListener("change", (e) => {
        state.intervalMs = Number(e.target.value) || 2000;
      });
      el.sessionFilter.addEventListener("input", render);
      el.kwFilter.addEventListener("input", render);

      setLive(true);
      fetchTraces().catch(() => render());
      schedule();
    </script>
  </body>
</html>
