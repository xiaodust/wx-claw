# WX-Claw 项目配置模板
# 复制此文件为 application.yml 并填入实际配置值

spring:
  # 多模态向量模型（doubao-embedding-vision）必须走 /embeddings/multimodal，
  # 向量记忆改用 VolcArkEmbeddingClient 纯 HTTP 调用，禁用 OpenAI embedding 自动配置
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  application:
    name: wx-claw-backfront

  # AI 模型配置
  ai:
    mcp:
      client:
        enabled: ${JOB_HELPER_MCP_ENABLED:true}
        initialized: false
        name: wx-claw
        version: 1.0.0
        type: SYNC
        request-timeout: ${JOB_HELPER_MCP_TIMEOUT:260s}
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            job-helper:
              url: ${JOB_HELPER_BASE_URL:http://127.0.0.1:8081}
              endpoint: /mcp
    openai:
      api-key: ${AI_API_KEY:your-api-key-here}
      base-url: ${AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      chat:
        model: ${AI_CHAT_MODEL:doubao-seed-evolving}
        temperature: 0.7
      image:
        model: ${AI_IMAGE_MODEL:doubao-seed-2-1-pro-260628}
    thinking:
      type: disabled

  # 数据库配置（本地 MySQL）
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/wx_claw_bot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000&tcpKeepAlive=true}
    username: ${DB_USERNAME:wxclaw}
    password: ${DB_PASSWORD:wxclaw-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_TIMEOUT_MS:30000}

  # JPA 配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # 邮件服务配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@qq.com}
    password: ${MAIL_PASSWORD:your-email-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.timeout: 5000

wxclaw:
  # 独立职业服务（岗位搜索、简历评分、个性化推荐）
  career:
    enabled: ${JOB_HELPER_ENABLED:false}
    api-key: ${JOB_HELPER_API_KEY:}
    connect-timeout: 3s
    resume-context-ttl: 365d
    resume-context-cleanup-ms: 60000
    max-resume-size: 10MB
    max-results-per-message: 10
    task:
      core-size: 2
      max-size: 4
      queue-capacity: 20

  # 业务线程池配置
  thread-pool:
    # 消息处理分区数：同一用户（租户+Bot+用户）的消息串行处理，不同用户并行
    message-partitions: ${MESSAGE_PARTITIONS:8}
    message-processing:
      core-size: 4
      max-size: 8
      queue-capacity: 100

  # API 安全配置
  api:
    auth-enabled: ${API_AUTH_ENABLED:true}
    bootstrap-credential-id: ${API_CREDENTIAL_ID:default}
    bootstrap-key: ${API_BOOTSTRAP_KEY:}
    last-used-write-interval-seconds: 60
    authentication-cache-ttl-seconds: 30
    # 认证缓存/写入标记的定时清理间隔
    authentication-cache-cleanup-ms: 600000
    cors:
      # 管理端 3000 + 用户控制台 3001
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}

  admin:
    audit:
      max-payload-chars: ${ADMIN_AUDIT_MAX_PAYLOAD_CHARS:2097152}

  # Agent 编排配置
  agent:
    # 跨请求工具熔断（双维度）：
    # 用户级先隔离个别用户（防恶意/异常输入拖垮服务），全局级兜底服务端依赖故障
    tool-circuit-breaker:
      enabled: true
      # 返回结果按项目约定识别失败（success=false 或 errorMsg 非空）
      count-error-msg-failures: true
      global:
        # 全局阈值更高：单个用户被隔离后不再向全局累计，需多个用户同时失败才触发
        failure-threshold: 20
        cooldown-seconds: 60
      user:
        enabled: true
        failure-threshold: 3
        cooldown-seconds: 120

  # 上下文记忆配置（会话摘要 + 长期记忆抽取）
  memory:
    summary:
      enabled: true
      # 消息数达到该值且距上次摘要超过间隔时，异步增量生成会话摘要
      trigger-message-threshold: 30
      min-interval-minutes: 30
      max-summary-chars: 1500
      max-messages-per-run: 100
    extraction:
      enabled: true
      # 低于该置信度的抽取结果不落库
      min-confidence: 0.6
      max-messages-per-run: 100
      # 自动记忆过期时间
      ttl-days: 90
    # 向量记忆（M3，默认关闭；需配置 embedding 模型后开启）
    vector:
      enabled: ${MEMORY_VECTOR_ENABLED:true}
      model: ${EMBEDDING_MODEL:doubao-embedding-vision-251215}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      chunk-chars: 200
      top-k: 5
      embedding-timeout: PT30S
      embedding-max-attempts: 3
      ttl-days: 90
      # 仅"还记得/之前/上次"等信号触发召回，默认不每轮检索
      recall-signal-only: true
    # 每日兜底扫描：超长会话补摘要、已关闭会话补抽取
    sweep-enabled: true
    sweep-cron: 0 0 5 * * ?

  # ILink 配置
  ilink:
    default-bot-id: ${ILINK_BOT_ID:default}
    bot-ids: ${ILINK_BOT_IDS:default}
    monitor:
      enabled: true
    reconnect:
      max-attempts: 5
      delay-seconds: 30
    # 待处理媒体上下文（图片/视频/文件字节）定时清理
    media-context-max-idle: PT24H
    media-context-cleanup-ms: 3600000
    # 消息防抖缓存定时兜底清理
    message-debouncer-cleanup-ms: 3600000
    # 已停止 Bot 运行时状态清理
    status-cleanup:
      cron: 0 30 3 * * ?
      retention-days: 7
    # 消息回执：进程内活跃处理租约，超过该时长视为 worker 挂起，允许重新认领
    receipt:
      reclaim-lease-seconds: 240
    # 游标推进：批量消息处理完成等待上限；超时不推进游标，依赖重新投递恢复
    checkpoint:
      drain-timeout-seconds: 300
    # ResumeContext 存储后端：db（MySQL，多实例共享，默认）/ file（本地文件，单机兼容）
    resume-context-store: db
    # 孤儿 ResumeContext 文件清理（不再属于 ACTIVE Bot）
    resume-context-cleanup:
      cron: 0 45 3 * * ?
      enabled: true

  ai:
    # 图片生成配置：默认 SiliconFlow（Kolors），可按服务商切换
    image:
      generate:
        # siliconflow / ark / openai（baseUrl 由模型目录按服务商提供）
        provider: ${IMAGE_GEN_PROVIDER:siliconflow}
        api-key: ${SILICONFLOW_API_KEY:your-siliconflow-api-key}
        model: Kwai-Kolors/Kolors
        image-size: 1024x1024
        num-inference-steps: 20
        guidance-scale: 7.5

    # 视频生成配置：默认火山方舟 Seedance，可切换 openai（Sora）/ dashscope
    video-gen:
      provider: ${VIDEO_GEN_PROVIDER:ark}
      openai:
        api-key: ${OPENAI_VIDEO_API_KEY:}
        model: ${OPENAI_VIDEO_MODEL:sora-2}
        base-url: ${OPENAI_VIDEO_BASE_URL:https://api.openai.com/v1}

    # TTS 语音合成配置
    tts:
      api-key: ${TTS_API_KEY:your-tts-api-key}
      url: https://openspeech.bytedance.com/api/v3/tts/create
      model: seed-audio-1.0
      output-format: wav
      sample-rate: 24000
      pitch-rate: 0
      speech-rate: 0
      loudness-rate: 0
      max-voice-ms: 60000
      timeout: PT90S
      max-attempts: 2

    # 时间配置
    time:
      zone: Asia/Shanghai

    # 网络搜索配置（博查）
    web-search:
      bocha:
        api-key: ${BOCHA_API_KEY:your-bocha-api-key}
        url: https://api.bochaai.com/v1/web-search
        timeout: PT15S
        default-count: 5
        default-summary: true
        default-freshness: noLimit

    # 天气服务配置（心知天气）
    weather:
      default-location: beijing
      source-text: 数据来源：心知天气
      seniverse:
        key: ${SENIVERSE_KEY:your-seniverse-key}
        now-url: https://api.seniverse.com/v3/weather/now.json
        daily-url: https://api.seniverse.com/v3/weather/daily.json
        timeout: PT10S
        language: zh-Hans
        unit: c

    # 聊天配置
    chat:
      max-tokens: 768
      timeout: PT25S
      hard-timeout: PT60S
      max-tool-calls: 8
      max-repeated-tool-calls: 2
    context:
      max-chars: 7000
      max-message-chars: 800

    # 文档发送配置
    document:
      enabled: true
      threshold: 2000

  # RAGFlow 知识库配置
  ragflow:
    enabled: ${RAGFLOW_ENABLED:false}
    base-url: ${RAGFLOW_BASE_URL:http://localhost:9380}
    api-key: ${RAGFLOW_API_KEY:your-ragflow-api-key}
    dataset-id: ${RAGFLOW_DATASET_ID:your-dataset-id}
    chat-id: ${RAGFLOW_CHAT_ID:your-chat-id}
    timeout: PT30S

  # 提醒功能配置
  reminder:
    enabled: true
    max-delay-days: 30
    retry-failed: true
    max-retry-count: 3
    retry-backoff-seconds: 30
    # 周期任务连续失败达到阈值后暂停（FAILED）并告警
    max-consecutive-failures: 5
    # 终态/孤儿任务定时清理
    cleanup:
      enabled: true
      cron: 0 0 2 * * ?
      retention-days: 7
      stale-pending-enabled: true

  # 文件上传配置
  upload:
    max-file-size-mb: 50

  knowledge:
    # Original uploads retained for exact file retrieval, separate from RAG chunks.
    file-storage-dir: ${KNOWLEDGE_FILE_STORAGE_DIR:.uploads/knowledge-files}
    # 超过保留期的原始文件定时清理
    cleanup-enabled: true
    cleanup-cron: 0 15 4 * * ?
    file-retention-days: 90

  # 邮件功能配置
  mail:
    enabled: true
    whitelist:
      - "*"
    rate-limit: 5
    # 限流计数定时清空
    cleanup-cron: 0 20 3 * * ?

  # 定时数据保留期清理
  cleanup:
    # iLink 消息回执（去重表），只清理已完成（DONE）且超过保留期的记录，默认 30 天
    receipts:
      enabled: true
      cron: 0 15 3 * * ?
      retention-days: 30
    # 滞留未完成回执的死信告警
    deadletter-alert-enabled: true
    deadletter-cron: 0 30 4 * * ?
    # 过期向量记忆分块 / 过期用户画像记忆清理
    memory-chunks:
      enabled: true
      cron: 0 15 3 * * ?
    user-profiles:
      enabled: true
      cron: 0 15 3 * * ?
    # LLM 调用观测记录，默认保留 90 天
    llm-invocations:
      enabled: true
      cron: 0 15 3 * * ?
      retention-days: 90
    # 过期 API 凭证
    credentials:
      enabled: true
      cron: 0 15 3 * * ?
    # 非活跃会话清理（会删除会话历史，默认关闭，需显式开启）
    conversations:
      enabled: false
      cron: 0 15 3 * * ?
      retention-days: 180
  # 日志配置
  log:
    level: info

  tenancy:
    enabled: true
    default-tenant-id: ${DEFAULT_TENANT_ID:default}
    require-context: true

# ===========================================
# 环境变量配置说明
# ===========================================
# API_AUTH_ENABLED     - 是否启用 API 认证（true/false）
# API_CREDENTIAL_ID    - 租户 API 凭据公开 ID
# API_BOOTSTRAP_KEY    - 首次启动时创建默认租户凭据的 Secret
# CORS_ALLOWED_ORIGINS - CORS 允许的来源（逗号分隔）
# AI_API_KEY           - AI 模型 API 密钥
# AI_BASE_URL          - AI 模型 API 地址
# AI_CHAT_MODEL        - 聊天模型名称
# AI_IMAGE_MODEL       - 图片理解模型名称
# SILICONFLOW_API_KEY  - SiliconFlow 图片生成 API 密钥
# IMAGE_GEN_PROVIDER   - 图片生成服务商（siliconflow/ark/openai）
# VIDEO_GEN_PROVIDER   - 视频生成服务商（ark/openai/dashscope）
# OPENAI_VIDEO_API_KEY - OpenAI Sora 视频生成 API 密钥（用户未配置时回退）
# OPENAI_VIDEO_MODEL   - OpenAI Sora 默认模型（sora-2）
# OPENAI_VIDEO_BASE_URL- OpenAI 视频 API 地址
# MAIL_HOST            - 邮件服务器地址
# MAIL_PORT            - 邮件服务器端口
# MAIL_USERNAME        - 邮箱账号
# MAIL_PASSWORD        - 邮箱密码/授权码
# TTS_API_KEY          - TTS 语音合成 API 密钥
# BOCHA_API_KEY        - 博查搜索 API 密钥
# SENIVERSE_KEY        - 心知天气 API 密钥
# RAGFLOW_ENABLED      - 是否启用 RAGFlow 知识库
# RAGFLOW_BASE_URL     - RAGFlow 服务地址
# RAGFLOW_API_KEY      - RAGFlow API 密钥
# RAGFLOW_DATASET_ID   - RAGFlow 知识库 ID
# RAGFLOW_CHAT_ID      - RAGFlow 聊天助手 ID
