name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Copy Maven settings (aliyun mirror)
        run: cp wx-claw-backfront/maven-settings.xml ~/.m2/settings.xml
      - name: Run tests
        # 排除需 MySQL 的启动冒烟测试；PromptGoldenEvalRunner(Testcontainers+真实模型)默认不匹配 surefire includes
        run: cd wx-claw-backfront && sh ./mvnw -B -ntp "-Dtest=!WxClawBackfrontApplicationTests" verify
  admin:
    name: Admin Console (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wx-claw-admin/package-lock.json
      - name: Install & build
        working-directory: wx-claw-admin
        run: |
          npm ci
          npm run build
  user:
    name: User Console (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wx-claw-user/package-lock.json
      - name: Install & build
        working-directory: wx-claw-user
        run: |
          npm ci
          npm run build